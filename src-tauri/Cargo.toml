[package]
name = "server-command-center"
version = "1.0.0"
description = "Server Command Center Desktop Application"
authors = ["Veyra"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"

# Added for Task 2
# Choosing rusqlite over sqlx because it natively compiles synchronously without async DB pools, and bundled makes deployment easy for Tauri.
rusqlite = { version = "0.31.0", features = ["bundled"] }
russh = "0.44.0"
russh-keys = "0.44.0"
russh-sftp = "2.0"
tokio = { version = "1.37.0", features = ["full"] }
aes-gcm = "0.10"
uuid = { version = "1.8", features = ["v4"] }
thiserror = "1.0"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
base64 = "0.22.1"
async-trait = "0.1"
regex = "1.10"
lazy_static = "1.5"
tempfile = "3.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.0", features = ["windows-native"] }
windows = { version = "0.58", features = ["Security_Credentials_UI", "Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.0", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.0", features = ["linux-native-sync-persistent", "crypto-rust"] }
